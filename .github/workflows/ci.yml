name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        run: uv sync --all-groups --frozen --python "$PYTHON_VERSION"

      - name: Check lockfile freshness
        if: matrix.python-version == '3.12'
        run: uv lock --check

      - name: Run repository hooks
        if: matrix.python-version == '3.12'
        env:
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Check types
        if: matrix.python-version == '3.12'
        run: >-
          uv run pyrefly check --config pyproject.toml --preset strict
          packages/advect/src

      - name: Test
        run: .venv/bin/python -m pytest --maxfail=1

      - name: Search primitive conformance thoroughly
        if: matrix.python-version == '3.12'
        run: >-
          uv run pytest packages/advect/tests/advect_conformance_tests
          --hypothesis-profile=thorough

  numpy-compatibility:
    name: NumPy ${{ matrix.numpy-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        numpy-version: ["2.0.*", "2.1.*", "2.2.*", "2.3.*", "2.4.*", "2.5.*"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked environment
        run: uv sync --all-groups --frozen

      - name: Select NumPy ${{ matrix.numpy-version }}
        env:
          NUMPY_VERSION: ${{ matrix.numpy-version }}
        run: uv pip install --python .venv/bin/python --upgrade "numpy==$NUMPY_VERSION"

      - name: Test the qualified NumPy surface
        run: >-
          .venv/bin/python -m pytest
          packages/advect/tests/advect_numpy_tests/test_support_evidence.py
          packages/advect/tests/advect_numpy_tests/test_version_compatibility.py
          packages/advect/tests/advect_numpy_tests/test_registration.py
          packages/advect/tests/advect_numpy_tests/test_stage_rng.py
          packages/advect/tests/advect_numpy_tests/test_op_bindings.py
          packages/advect/tests/advect_numpy_tests/dispatch/array_functions/test_out_param.py::test_staged_take_out_matches_numpy_casting_policy
          packages/advect/tests/advect_numpy_tests/dispatch/array_functions/test_out_param.py::test_compress_out_matches_numpy_casting_policy
          packages/advect/tests/advect_grad_tests/test_numpy_autodiff.py
          packages/advect/tests/advect_grad_tests/test_jvp_api.py

  array-api-compatibility:
    name: array-api-compat ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 1.11.2
            requirement: array-api-compat==1.11.2
          - label: latest-1.x
            requirement: array-api-compat>=1.11.2,<2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked environment
        run: uv sync --all-groups --frozen

      - name: Select ${{ matrix.requirement }}
        env:
          ARRAY_API_COMPAT_REQUIREMENT: ${{ matrix.requirement }}
        run: >-
          uv pip install --python .venv/bin/python
          --upgrade "$ARRAY_API_COMPAT_REQUIREMENT"

      - name: Test every supported revision request
        run: >-
          .venv/bin/python -m pytest
          packages/advect/tests/advect_array_api_compat_tests/test_provider.py

  xarray-compatibility:
    name: xarray ${{ matrix.label }}
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 2024.6 / NumPy 2.0
            python-version: "3.12"
            numpy-requirement: numpy==2.0.*
            xarray-requirement: xarray==2024.6.0
          - label: latest
            python-version: "3.14"
            numpy-requirement: numpy>=2.0,<2.6
            xarray-requirement: xarray>=2024.6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install locked environment
        run: uv sync --all-groups --frozen --python "$PYTHON_VERSION"

      - name: Select xarray compatibility pair
        env:
          NUMPY_REQUIREMENT: ${{ matrix.numpy-requirement }}
          XARRAY_REQUIREMENT: ${{ matrix.xarray-requirement }}
        run: >-
          uv pip install --python .venv/bin/python
          --upgrade
          "$NUMPY_REQUIREMENT" "$XARRAY_REQUIREMENT"

      - name: Test the xarray boundary
        run: >-
          .venv/bin/python -m pytest
          packages/advect/tests/advect_xarray_tests

  optional-dependency-compatibility:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: SciPy 1.18
            python-version: "3.12"
            suite: scipy
            numpy-requirement: numpy==2.4.*
            scipy-requirement: scipy==1.18.0
          - label: SciPy latest 1.x
            python-version: "3.14"
            suite: scipy
            numpy-requirement: numpy>=2.0,<2.6
            scipy-requirement: scipy>=1.18,<2
          - label: Host autodiff lower bounds
            python-version: "3.12"
            suite: interop
            autograd-requirement: autograd==1.9.1
            jax-requirement: jax==0.4.38
            torch-requirement: torch==2.3.1
          - label: Host autodiff latest
            python-version: "3.14"
            suite: interop
            autograd-requirement: autograd>=1.9.1,<2
            jax-requirement: jax>=0.4.38,<0.12
            torch-requirement: torch>=2.3.1,<3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "$PYTHON_VERSION"

      - name: Install locked environment
        run: uv sync --all-groups --frozen --python "$PYTHON_VERSION"

      - name: Select optional dependencies
        env:
          AUTOGRAD_REQUIREMENT: ${{ matrix.autograd-requirement }}
          JAX_REQUIREMENT: ${{ matrix.jax-requirement }}
          NUMPY_REQUIREMENT: ${{ matrix.numpy-requirement }}
          SCIPY_REQUIREMENT: ${{ matrix.scipy-requirement }}
          TORCH_REQUIREMENT: ${{ matrix.torch-requirement }}
        run: |
          dependencies=('numpy>=2.0,<2.6')
          for requirement in \
            "$AUTOGRAD_REQUIREMENT" \
            "$JAX_REQUIREMENT" \
            "$NUMPY_REQUIREMENT" \
            "$SCIPY_REQUIREMENT"; do
            if [[ -n "$requirement" ]]; then
              dependencies+=("$requirement")
            fi
          done
          uv pip install --python .venv/bin/python --upgrade "${dependencies[@]}"
          if [[ -n "$TORCH_REQUIREMENT" ]]; then
            uv pip install \
              --python .venv/bin/python \
              --upgrade "$TORCH_REQUIREMENT" \
              --index https://download.pytorch.org/whl/cpu
          fi

      - name: Test SciPy
        if: matrix.suite == 'scipy'
        run: >-
          .venv/bin/python -m pytest
          packages/advect/tests/advect_scipy_tests

      - name: Test host autodiff
        if: matrix.suite == 'interop'
        run: >-
          .venv/bin/python -m pytest
          packages/advect/tests/advect_interop_tests

  pyodide:
    name: Pyodide / NumPy 2.4
    runs-on: ubuntu-latest
    env:
      PYODIDE_XBUILDENV_PATH: ${{ github.workspace }}/.cache/pyodide-xbuildenv
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-emscripten

      - name: Cache the Pyodide cross-build environment
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PYODIDE_XBUILDENV_PATH }}
          key: pyodide-0.36.0-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'Cargo.lock') }}
          restore-keys: |
            pyodide-0.36.0-${{ runner.os }}-

      - name: Install Pyodide build tools
        run: python -m pip install pyodide-build==0.36.0

      - name: Build the WebAssembly wheel
        run: |
          mkdir -p dist
          pyodide build . --outdir dist/pyodide

      - name: Upload the WebAssembly wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pyodide-wheel
          path: dist/pyodide/*.whl
          if-no-files-found: error
          retention-days: 1

      - name: Create the Pyodide runtime
        run: pyodide venv .venv-pyodide

      - name: Install Advect into Pyodide
        run: .venv-pyodide/bin/python -m pip install dist/pyodide/advect-*.whl

      - name: Execute the gradient smoke test in Pyodide
        run: .venv-pyodide/bin/python scripts/smoke_pyodide.py

      - name: Run the documentation snippets in Pyodide
        run: .venv-pyodide/bin/python scripts/run_doc_snippets.py docs

  docs:
    name: Documentation
    needs: pyodide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Download the WebAssembly wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyodide-wheel
          path: dist/pyodide

      - name: Run the documentation snippets
        run: uv run python scripts/run_doc_snippets.py docs

      - name: Build documentation
        run: uv run mkdocs build --strict

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          command-arguments: -W unmaintained

  native-wheels:
    name: Native Wheels
    uses: ./.github/workflows/native-wheels.yml
    permissions:
      contents: read

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan Git history
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: ./gitleaks git --redact --verbose --log-opts="$SOURCE_REVISION"

  ci-success:
    name: CI Success
    needs:
      - python
      - numpy-compatibility
      - array-api-compatibility
      - xarray-compatibility
      - optional-dependency-compatibility
      - pyodide
      - docs
      - rust
      - native-wheels
      - secrets
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check blocking jobs
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          NUMPY_RESULT: ${{ needs.numpy-compatibility.result }}
          ARRAY_API_COMPAT_RESULT: ${{ needs.array-api-compatibility.result }}
          XARRAY_RESULT: ${{ needs.xarray-compatibility.result }}
          OPTIONAL_DEPENDENCIES_RESULT: ${{ needs.optional-dependency-compatibility.result }}
          PYODIDE_RESULT: ${{ needs.pyodide.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          WHEELS_RESULT: ${{ needs.native-wheels.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          for result in \
            "$PYTHON_RESULT" \
            "$NUMPY_RESULT" \
            "$ARRAY_API_COMPAT_RESULT" \
            "$XARRAY_RESULT" \
            "$OPTIONAL_DEPENDENCIES_RESULT" \
            "$PYODIDE_RESULT" \
            "$DOCS_RESULT" \
            "$RUST_RESULT" \
            "$WHEELS_RESULT" \
            "$SECRETS_RESULT"; do
            test "$result" = "success"
          done
