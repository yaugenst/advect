name: Docs

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Version label to publish with mike
        required: true
        type: string
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-22.04
    permissions:
      contents: write # mike pushes the rendered version to gh-pages
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # mike commits to the gh-pages branch, which must be fetchable
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-emscripten

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Resolve documentation version
        id: docs
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          docs_version=${REQUESTED_VERSION:-dev}
          if [[ "$docs_version" != "dev" && ! "$docs_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "documentation version must be dev or a stable semantic version" >&2
            exit 1
          fi
          echo "version=$docs_version" >> "$GITHUB_OUTPUT"
          if [[ "$docs_version" == "dev" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Install Pyodide build tools
        run: python -m pip install pyodide-build==0.36.0

      - name: Build the Advect browser wheel
        run: |
          mkdir -p dist
          pyodide build . --outdir dist/pyodide

      - name: Test the Advect browser wheel
        run: |
          pyodide venv .venv-pyodide
          .venv-pyodide/bin/python -m pip install dist/pyodide/advect-*.whl
          .venv-pyodide/bin/python scripts/smoke_pyodide.py
          .venv-pyodide/bin/python scripts/run_doc_snippets.py docs

      - name: Run the documentation snippets natively
        run: uv run python scripts/run_doc_snippets.py docs

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy development documentation
        if: steps.docs.outputs.release == 'false'
        env:
          DOCS_VERSION: ${{ steps.docs.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          uv run mike deploy --push "$DOCS_VERSION"

      - name: Deploy released documentation
        if: steps.docs.outputs.release == 'true'
        env:
          DOCS_VERSION: ${{ steps.docs.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          uv run mike deploy --push --update-aliases "$DOCS_VERSION" latest
          uv run mike set-default --push latest
