name: Docs

on:
  workflow_call:
    inputs:
      source_revision:
        description: Immutable source commit to document; defaults to the triggering commit
        required: false
        type: string
        default: ""
      version:
        description: Version label to publish with mike
        required: false
        type: string
        default: ""

concurrency:
  group: docs-${{ inputs.version != '' && 'deploy' || github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-22.04
    env:
      PYODIDE_XBUILDENV_PATH: ${{ github.workspace }}/.cache/pyodide-xbuildenv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # mike commits to the gh-pages branch, which must be fetchable
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_revision || github.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-emscripten

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version-file: pyproject.toml

      - name: Cache the Pyodide cross-build environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PYODIDE_XBUILDENV_PATH }}
          key: pyodide-0.36.0-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'Cargo.lock') }}
          restore-keys: |
            pyodide-0.36.0-${{ runner.os }}-

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Install Pyodide build tools
        run: python -m pip install pyodide-build==0.36.0

      - name: Build the WebAssembly wheel
        run: |
          mkdir -p dist
          pyodide build . --outdir dist/pyodide

      - name: Create the Pyodide runtime
        run: pyodide venv .venv-pyodide

      - name: Install Advect into Pyodide
        run: .venv-pyodide/bin/python -m pip install dist/pyodide/advect-*.whl

      - name: Execute the gradient smoke test in Pyodide
        run: .venv-pyodide/bin/python scripts/smoke_pyodide.py

      - name: Run the documentation snippets in Pyodide
        run: .venv-pyodide/bin/python scripts/run_doc_snippets.py docs

      - name: Run the documentation snippets natively
        run: uv run python scripts/run_doc_snippets.py docs

      - name: Build documentation
        env:
          ADVECT_REQUIRE_BROWSER_WHEEL: "1"
        run: uv run mkdocs build --strict

      - name: Check documentation search
        run: node scripts/check_docs_search.cjs

      - name: Check documentation shell
        run: node scripts/check_docs_shell.cjs

      - name: Configure git identity
        if: inputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy development documentation
        if: inputs.version == 'dev'
        env:
          DOCS_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          uv run mike deploy --push "$DOCS_VERSION"

      - name: Deploy released documentation
        if: inputs.version != '' && inputs.version != 'dev'
        env:
          DOCS_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          uv run mike deploy --push --update-aliases "$DOCS_VERSION" latest
          uv run mike set-default --push latest
