name: Numerical Evidence

on:
  workflow_dispatch:
    inputs:
      reference_revision:
        description: Exact Git revision used to build the Advect performance reference
        required: true
        default: origin/main
        type: string

permissions:
  contents: read

concurrency:
  group: numerical-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  ADVECT_SOURCE_REVISION: ${{ github.sha }}
  FORCE_COLOR: "1"
  UV_SYSTEM_PYTHON: "1"

jobs:
  cpu-evidence:
    name: CPU qualification / Array API ${{ matrix.array-api-version }}
    runs-on: ubuntu-latest
    env:
      ARRAY_API_VERSION: ${{ matrix.array-api-version }}
    strategy:
      fail-fast: false
      matrix:
        array-api-version: ["2022.12", "2023.12", "2024.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Resolve exact evidence revisions
        id: revisions
        shell: bash
        env:
          REFERENCE_REVISION_INPUT: ${{ inputs.reference_revision }}
        run: |
          reference_revision=$(git rev-parse --verify --end-of-options "$REFERENCE_REVISION_INPUT^{commit}")
          candidate_revision=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
          {
            echo "reference_revision=$reference_revision"
            echo "reference_short=${reference_revision:0:12}"
            echo "candidate_revision=$candidate_revision"
            echo "candidate_short=${candidate_revision:0:12}"
          } >> "$GITHUB_OUTPUT"

      - name: Create evidence directories
        run: |
          mkdir -p \
            artifacts/benchmarks \
            artifacts/wheels/candidate \
            artifacts/wheels/reference \
            "artifacts/qualification/$ARRAY_API_VERSION"

      - name: Record the Array API support inventory
        run: >-
          uv run python -m scripts.report_array_api_support
          --array-api-version "$ARRAY_API_VERSION"
          --format json
          --output
          "artifacts/qualification/$ARRAY_API_VERSION/array-api-support.json"

      - name: Qualify every staged Array API operation
        run: >-
          uv run python -m scripts.qualify_array_api_operations
          --array-api-version "$ARRAY_API_VERSION"
          --providers array-api-strict
          --subset all
          --output
          "artifacts/qualification/$ARRAY_API_VERSION/array-api-all.json"

      - name: Qualify portable Array API operations
        run: >-
          uv run python -m scripts.qualify_array_api_operations
          --array-api-version "$ARRAY_API_VERSION"
          --providers array-api-strict,numpy
          --subset portable
          --output
          "artifacts/qualification/$ARRAY_API_VERSION/array-api-portable.json"

      - name: Qualify scientific provider paths
        run: >-
          uv run python -m scripts.qualify_array_providers
          --array-api-version "$ARRAY_API_VERSION"
          --providers numpy,array-api-strict
          --output
          "artifacts/qualification/$ARRAY_API_VERSION/array-provider-scientific.json"

      - name: Check out the pinned official Array API suite
        run: |
          git clone https://github.com/data-apis/array-api-tests .array-api-tests
          git -C .array-api-tests checkout \
            5d0b701b0c4ab6ec98794068cf7af393a8a51c61
          git -C .array-api-tests submodule update --init

      - name: Run the official Array API suite through every lifetime
        run: >-
          uv run
          --with 'hypothesis>=6.151.0'
          --with ndindex
          --with pytest-json-report
          python -m scripts.run_array_api_conformance
          --suite-path .array-api-tests
          --array-api-version "$ARRAY_API_VERSION"
          --mode all
          --max-examples 10
          --output
          "artifacts/qualification/$ARRAY_API_VERSION/array-api-official-suite.json"

      - name: Build exact reference and candidate wheels
        if: matrix.array-api-version == '2024.12'
        id: performance-wheels
        shell: bash
        env:
          REFERENCE_REVISION: ${{ steps.revisions.outputs.reference_revision }}
        run: |
          git worktree add --detach .benchmark-reference "$REFERENCE_REVISION"
          uv build --project .benchmark-reference --package advect --wheel \
            --out-dir "$GITHUB_WORKSPACE/artifacts/wheels/reference" --clear
          uv build --package advect --wheel \
            --out-dir "$GITHUB_WORKSPACE/artifacts/wheels/candidate" --clear
          reference_wheel=$(find artifacts/wheels/reference -maxdepth 1 -name '*.whl' -print -quit)
          candidate_wheel=$(find artifacts/wheels/candidate -maxdepth 1 -name '*.whl' -print -quit)
          {
            echo "reference_revision=$REFERENCE_REVISION"
            echo "reference_wheel=$reference_wheel"
            echo "candidate_wheel=$candidate_wheel"
          } >> "$GITHUB_OUTPUT"

      - name: Gate Advect reference-versus-candidate performance
        if: matrix.array-api-version == '2024.12'
        env:
          CANDIDATE_REVISION: ${{ steps.revisions.outputs.candidate_revision }}
          CANDIDATE_SHORT: ${{ steps.revisions.outputs.candidate_short }}
          CANDIDATE_WHEEL: ${{ steps.performance-wheels.outputs.candidate_wheel }}
          REFERENCE_REVISION: ${{ steps.revisions.outputs.reference_revision }}
          REFERENCE_SHORT: ${{ steps.revisions.outputs.reference_short }}
          REFERENCE_WHEEL: ${{ steps.performance-wheels.outputs.reference_wheel }}
        run: >-
          uv run python -m scripts.bench_advect_regression
          --reference-wheel "$REFERENCE_WHEEL"
          --candidate-wheel "$CANDIDATE_WHEEL"
          --reference-revision "$REFERENCE_REVISION"
          --candidate-revision "$CANDIDATE_REVISION"
          --warmed-replicates 5
          --acceptance
          --format json
          --output
          "artifacts/benchmarks/advect-regression-$CANDIDATE_SHORT-vs-$REFERENCE_SHORT.json"

      - name: Gate the CPU runtime-memory profile
        if: matrix.array-api-version == '2024.12'
        env:
          CANDIDATE_SHORT: ${{ steps.revisions.outputs.candidate_short }}
        run: >-
          uv run python -m scripts.bench_runtime_memory
          --profile cpu-runtime
          --acceptance
          --format json
          --output
          "artifacts/benchmarks/runtime-memory-cpu-$CANDIDATE_SHORT.json"

      - name: Upload numerical evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: numerical-evidence-cpu-${{ matrix.array-api-version }}-${{ steps.revisions.outputs.candidate_short }}-vs-${{ steps.revisions.outputs.reference_short }}
          path: artifacts
