name: Native Wheels

on:
  workflow_call:
    inputs:
      source_revision:
        description: Immutable source commit to build; defaults to the triggering commit
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"

jobs:
  wheelhouse:
    name: ${{ matrix.platform.name }} / Python ${{ matrix.python.version }}
    runs-on: ${{ matrix.platform.runner }}
    env:
      PYTHON_VERSION: ${{ matrix.python.version }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: "3.12"
            artifact: py312
          - version: "3.13"
            artifact: py313
          - version: "3.14"
            artifact: py314
        platform:
          - name: Linux x86-64
            artifact: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64
            interpreter: versioned
            manylinux: "2_17"
          - name: Linux arm64
            artifact: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            interpreter: versioned
            manylinux: "2_17"
          - name: macOS Intel
            artifact: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            interpreter: python
            manylinux: auto
          - name: macOS Apple silicon
            artifact: macos-arm64
            runner: macos-latest
            target: aarch64
            interpreter: python
            manylinux: auto
          - name: Windows x86-64
            artifact: windows-x86_64
            runner: windows-latest
            target: x64
            interpreter: python
            manylinux: auto

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_revision || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python.version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version-file: pyproject.toml

      - name: Build portable wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          maturin-version: v1.14.1
          rust-toolchain: 1.94.0
          args: >-
            --release
            --locked
            --compatibility pypi
            --out dist/wheelhouse
            --interpreter ${{ matrix.platform.interpreter == 'versioned' && format('python{0}', matrix.python.version) || matrix.platform.interpreter }}
            --manifest-path packages/advect-native/Cargo.toml

      - name: Smoke-test installed wheel
        run: |
          wheel_count=$(find dist/wheelhouse -maxdepth 1 -name 'advect-*.whl' | wc -l)
          test "$wheel_count" -eq 1
          for profile in base array-api scientific; do
            environment=".wheel-${profile}-smoke"
            uv venv "$environment" --python "$PYTHON_VERSION"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              smoke_python="$environment/Scripts/python.exe"
            else
              smoke_python="$environment/bin/python"
            fi
            dependencies=('numpy>=2.0,<2.6' 'array-api-compat>=1.11.2,<2')
            requirement=advect
            if [[ "$profile" == "array-api" ]]; then
              dependencies+=(array-api-strict==2.4.1)
            elif [[ "$profile" == "scientific" ]]; then
              dependencies+=('scipy>=1.18,<2' 'xarray>=2024.6')
              requirement='advect[scipy,xarray]'
            fi
            uv pip install --python "$smoke_python" "${dependencies[@]}"
            uv pip install \
              --python "$smoke_python" \
              --no-cache \
              --no-index \
              --find-links dist/wheelhouse \
              "$requirement"
            "$smoke_python" scripts/smoke_wheel_install.py "$profile"
          done

      - name: Smoke-test simultaneous dependency minimums
        if: matrix.platform.artifact == 'linux-x86_64' && matrix.python.version == '3.12'
        run: |
          uv venv .wheel-minimum-smoke --python "$PYTHON_VERSION"
          uv pip install \
            --python .wheel-minimum-smoke/bin/python \
            numpy==2.0.2 \
            array-api-compat==1.11.2 \
            scipy==1.18.0 \
            xarray==2024.6.0
          uv pip install \
            --python .wheel-minimum-smoke/bin/python \
            --no-cache \
            --no-index \
            --find-links dist/wheelhouse \
            'advect[scipy,xarray]'
          uv pip check --python .wheel-minimum-smoke/bin/python
          .wheel-minimum-smoke/bin/python scripts/smoke_wheel_install.py scientific

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: advect-distribution-${{ matrix.platform.artifact }}-${{ matrix.python.artifact }}
          path: dist/wheelhouse/advect-*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_revision || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version-file: pyproject.toml

      - name: Build and verify source distribution
        run: |
          uv build --package advect --sdist --out-dir dist/sdist --clear
          uv build \
            --wheel \
            dist/sdist/advect-*.tar.gz \
            --out-dir dist/sdist-wheel \
            --clear
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          sdist = next(Path("dist/sdist").glob("advect-*.tar.gz"))
          wheel = next(Path("dist/sdist-wheel").glob("advect-*.whl"))
          root = sdist.name.removesuffix(".tar.gz")
          with tarfile.open(sdist) as archive:
              names = set(archive.getnames())
              assert f"{root}/LICENSE" in names
              assert f"{root}/Cargo.toml" in names
              assert f"{root}/packages/advect-native/Cargo.toml" in names
          with zipfile.ZipFile(wheel) as archive:
              licenses = [
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/licenses/LICENSE")
              ]
              assert len(licenses) == 1
          PY

          uv venv .sdist-smoke --python 3.12
          uv pip install \
            --python .sdist-smoke/bin/python \
            'numpy>=2.0,<2.6' \
            'array-api-compat>=1.11.2,<2'
          uv pip install \
            --python .sdist-smoke/bin/python \
            --no-cache \
            --no-index \
            --find-links dist/sdist-wheel \
            advect
          .sdist-smoke/bin/python scripts/smoke_wheel_install.py base

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: advect-distribution-sdist
          path: dist/sdist/advect-*.tar.gz
          if-no-files-found: error
