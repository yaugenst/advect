name: Legacy release (retired)

on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Use the rehearsal or publication workflow
    runs-on: ubuntu-22.04
    steps:
      - name: Refuse the retired path
        run: |
          echo "This legacy workflow is retired and must remain disabled." >&2
          echo "Use rehearse-release.yml or publish-release.yml." >&2
          exit 1
