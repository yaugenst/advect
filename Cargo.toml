[workspace]
members = [ "packages/advect-native", "packages/advect-runtime" ]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
authors = [ "Yannick Augenstein" ]
description = "Required native compute-graph core for Advect"
readme = "README.md"
homepage = "https://yaugenst.github.io/advect/"
repository = "https://github.com/yaugenst/advect"
documentation = "https://yaugenst.github.io/advect/"
keywords = [ "graph", "autodiff", "tracing", "python" ]
categories = [ "algorithms", "science" ]

[workspace.dependencies]
pyo3 = { version = "0.29" }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
float_cmp = "warn"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
many_single_char_names = "allow"
missing_const_for_fn = "allow"
missing_panics_doc = "allow"
items_after_statements = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
suboptimal_flops = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
use_self = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.bench]
debug = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
