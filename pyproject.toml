[project]
name = "advect"
dynamic = [ "version" ]
description = "Automatic differentiation for the NumPy code you already write"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = [
  "LICENSE",
  "RUST_STDLIB_COPYRIGHT.html",
  "RUST_STDLIB_LICENSE_MIT.txt",
  "RUST_STDLIB_LICENSE_UNICODE_3_0.txt",
  "THIRD_PARTY_LICENSES.txt",
]
authors = [ { name = "Yannick Augenstein" } ]
keywords = [
  "tracing",
  "autodiff",
  "array-api",
  "numpy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]

dependencies = [
  "array-api-compat>=1.11.2,<2",
  "numpy>=2.0,<2.6",
]

[project.urls]
Documentation = "https://yaugenst.github.io/advect/"
Issues = "https://github.com/yaugenst/advect/issues"
Repository = "https://github.com/yaugenst/advect"

[project.optional-dependencies]
autograd = [ "autograd>=1.9.1,<2" ]
jax = [ "jax>=0.4.38,<0.12" ]
scipy = [ "scipy>=1.18,<2" ]
torch = [ "torch>=2.3.1,<3" ]
xarray = [ "xarray>=2024.6" ]

[dependency-groups]
dev = [
  "array-api-strict==2.4.1",
  "autograd>=1.9.1,<2",
  "hypothesis[numpy]>=6.148.3",
  "pre-commit>=4.5,<5",
  "pyrefly==1.2.0",
  "pytest>=9.0.3",
  "pytest-xdist>=3.8,<4",
  "ruff==0.16.2",
  "scipy>=1.18,<2",
  "xarray>=2024.6",
]
docs = [
  "click>=8.3.3",
  "mike>=2.1",
  "mkdocs>=1.6",
  "mkdocs-llmstxt>=0.5,<0.6",
  "mkdocstrings[python]>=0.29",
]

[build-system]
requires = [ "maturin>=1.12,<2" ]
build-backend = "maturin"

[tool.uv]
required-version = "==0.12.3"

[tool.maturin]
exclude = [ "**/AGENTS.md" ]
features = [ "extension-module" ]
locked = true
manifest-path = "packages/advect-native/Cargo.toml"
module-name = "advect._native_core"
python-source = "packages/advect/src"

# ==============================================================================
# Ruff Configuration - Maximum strictness
# ==============================================================================

[tool.ruff]
src = [
  "packages/advect/src",
  "packages/advect/tests",
]
extend-exclude = [ "*.md" ]
line-length = 100
required-version = "==0.16.2"

[tool.ruff.lint]
# Enable ALL rules, then selectively disable problematic ones
select = [ "ALL" ]

ignore = [
  # Formatter conflicts (let ruff format handle these)
  "W191",   # tab-indentation
  "E111",   # indentation-with-invalid-multiple
  "E114",   # indentation-with-invalid-multiple-comment
  "E117",   # over-indented
  "D206",   # indent-with-spaces
  "D300",   # triple-single-quotes
  "Q000",   # bad-quotes-inline-string
  "Q001",   # bad-quotes-multiline-string
  "Q002",   # bad-quotes-docstring
  "Q003",   # avoidable-escaped-quote
  "Q004",   # unnecessary-escaped-quote
  "COM812", # missing-trailing-comma (conflicts with formatter)
  "COM819", # prohibited-trailing-comma

  # Opinionated rules we disagree with
  "D107",   # undocumented-public-init (we document in class docstring)
  "TD002",  # missing-todo-author
  "TD003",  # missing-todo-link
  "FIX002", # line-contains-todo (we allow TODOs)

  # Exception-message indirection adds noise to local validation errors.
  "EM101",  # raw-string-in-exception
  "EM102",  # f-string-in-exception
  "TRY003", # raise-vanilla-args

  # Per-file copyright banners are not project policy.
  "CPY001", # missing-copyright-notice
]

[tool.ruff.lint.per-file-ignores]
"packages/advect/src/advect/_native_core.pyi" = [
  "PYI021", # module docstring is required by the recursive documentation contract
]

# Tests can use magic values, assertions, and don't need object-level documentation
"packages/**/tests/**/*.py" = [
  "S101",    # assert
  "PLR2004", # magic-value-comparison
  "D103",    # undocumented-public-function (test functions)
  "D101",    # undocumented-public-class (test classes)
  "ANN",     # type annotations (tests are less strict)
  "PLR0913", # too-many-arguments (test functions can have many fixtures)
  "SLF001",  # private-member-access (tests need to access internals)
]

# Scripts can print user-facing results.
"scripts/**/*.py" = [
  "T201", # print
]

"packages/advect/src/advect/autodiff/rules/array_family/jvp/*.py" = [
  "ANN401", # JVP rule signatures intentionally track runtime op contracts
  "ARG001", # many signatures mirror traced op contracts
]
"packages/advect/src/advect/autodiff/rules/array_family/vjp/**/*.py" = [
  "ANN401", # VJP rule signatures intentionally mirror runtime op contracts
  "ARG001", # many signatures mirror traced op contracts
  "N803",   # NumPy keyword casing (e.g. UPLO) is runtime contract
]
"packages/advect/src/advect/autodiff/rules/array_family/_transpose_utils.py" = [
  "ANN401", # transpose utilities operate on generic cotangent pytrees
]

[tool.ruff.lint.isort]
known-first-party = [
  "advect",
]
known-third-party = [ "numpy", "scipy", "xarray" ]
required-imports = [ "from __future__ import annotations" ]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

# ==============================================================================
# Pyrefly Configuration - Strict runtime-source checking
# ==============================================================================

[tool.pyrefly]
preset = "strict"
min-severity = "warn"
python-version = "3.12"
use-ignore-files = false
disable-search-path-heuristics = true
disable-project-excludes-heuristics = true
project-includes = [
  "docs-theme/playground_runtime.py",
  "packages/advect/src",
  "scripts/_support/release_artifacts.py",
  "scripts/assemble_release_artifacts.py",
  "scripts/griffe_lazy_exports.py",
  "scripts/mkdocs_hooks.py",
  "scripts/run_doc_snippets.py",
  "scripts/smoke_pyodide.py",
  "scripts/smoke_wheel_install.py",
]
search-path = [
  "packages/advect/src",
  "scripts",
]

# ==============================================================================
# Pytest Configuration
# ==============================================================================

[tool.pytest.ini_options]
testpaths = [ "packages/advect/src/advect", "packages/advect/tests" ]
addopts = [
  "--doctest-modules",
  "--ignore=packages/advect/src/advect/interop",
  "-ra",
  "--strict-markers",
  "--strict-config",
  "-v",
  "--tb=short",
]
filterwarnings = [ "error" ]
xfail_strict = true
